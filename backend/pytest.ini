[pytest]
testpaths = tests
pythonpath = .
addopts = -ra
markers =
    db: necesita PostgreSQL (BD de pruebas POSTGRES_TEST_DB); se salta si no está accesible
    csv: suite sobre data/csv (BD dedicada cajaclara_csv cargada con app.db.cargar_csv); se salta si no hay CSV o BD
filterwarnings =
    ignore::DeprecationWarning:httpx.*
